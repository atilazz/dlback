name: Bypass ouo.io/ouo.press Links

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'لینک‌های ouo.io و ouo.press (هر لینک در یک خط)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout ouo-bypass script
        uses: actions/checkout@v4
        with:
          repository: B3H1Z/ouo-link-bypass
          path: ouo-bypass

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd ouo-bypass
          pip install -r requirements.txt
          cd ..

      - name: Bypass links
        run: |
          mkdir -p dl
          cd ouo-bypass
          
          # تبدیل لینک‌های ورودی به آرگومان
          LINKS_ARGS=$(echo "${{ github.event.inputs.links }}" | tr '\n' ' ')
          
          # اجرای اسکریپت برای همه لینک‌ها
          python ouo_bypass.py $LINKS_ARGS | tee ../dl/output.txt
          
          cd ..
          
          # استخراج لینک‌های نهایی از خروجی
          grep -E 'https?://' dl/output.txt | grep -v 'ouo.' > dl/successful_links.txt || true
          
      - name: Save results
        run: |
          echo "📊 نتایج پردازش:" > dl/link.txt
          echo "=================" >> dl/link.txt
          echo "" >> dl/link.txt
          echo "لینک‌های اصلی (successful_links.txt):" >> dl/link.txt
          cat dl/successful_links.txt >> dl/link.txt 2>/dev/null || echo "هیچ لینک موفقی یافت نشد" >> dl/link.txt
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Bypass ouo links [skip ci]" || echo "No changes to commit"
          git push
