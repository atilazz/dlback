name: Bypass Multiple ouo.press Links

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'لینک‌های ouo.press (با ویرگول یا خط جدید جدا کنید)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyBypass
        run: pip install PyBypass

      - name: Process all links and save to dl/link.txt
        run: |
          mkdir -p dl
          python3 << 'EOF'
          import PyBypass as bypasser
          import os

          # دریافت ورودی
          raw_input = os.environ.get('LINKS_INPUT', '')
          
          # تبدیل ویرگول به خط جدید و حذف فاصله‌ها
          lines = raw_input.replace(',', '\n').split('\n')
          links = []
          for line in lines:
              line = line.strip()
              if line and line.startswith('http'):
                  links.append(line)
          
          print(f"🔍 تعداد لینک‌های دریافتی: {len(links)}")
          
          results = []
          for idx, short_link in enumerate(links, 1):
              print(f"\n📥 پردازش {idx}/{len(links)}: {short_link}")
              try:
                  final_link = bypasser.bypass(short_link)
                  results.append(final_link)
                  print(f"   ✅ لینک اصلی: {final_link}")
              except Exception as e:
                  error_msg = f"ERROR: {e}"
                  results.append(error_msg)
                  print(f"   ❌ {error_msg}")
          
          # ذخیره در فایل link.txt داخل پوشه dl
          with open('dl/link.txt', 'w', encoding='utf-8') as f:
              for original, final in zip(links, results):
                  f.write(f"{original} -> {final}\n")
          
          print(f"\n✅ نتایج در فایل dl/link.txt ذخیره شد.")
          EOF
        env:
          LINKS_INPUT: ${{ github.event.inputs.links }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/link.txt
          git commit -m "Add bypassed links [skip ci]" || echo "No changes to commit"
          git push
