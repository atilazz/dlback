name: دانلود خودکار ویدیو از چند لینک

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'لینک‌های صفحات حاوی ویدیو (با ویرگول، فاصله یا خط جدید جدا کنید)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp with curl_cffi (impersonation support)
        run: |
          pip install yt-dlp
          pip install curl_cffi

      - name: Download videos
        run: |
          mkdir -p dl
          python3 << 'EOF'
          import os
          import re
          import subprocess
          import time

          def get_unique_filename(base_path):
              if not os.path.exists(base_path):
                  return base_path
              name, ext = os.path.splitext(base_path)
              counter = 1
              while True:
                  new_path = f"{name}_{counter}{ext}"
                  if not os.path.exists(new_path):
                      return new_path
                  counter += 1

          def sanitize_filename(filename):
              return re.sub(r'[<>:"/\\|?*]', '_', filename)

          def download_with_ytdlp(url, output_template):
              """دانلود با استفاده از yt-dlp با تنظیمات impersonation"""
              cmd = [
                  'yt-dlp',
                  '-o', output_template,
                  '--no-warnings',
                  '--impersonate', 'chrome-120',  # impersonate as Chrome 120
                  '--user-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  '--add-header', 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                  '--add-header', 'Accept-Language: en-US,en;q=0.9',
                  '--add-header', 'Accept-Encoding: gzip, deflate, br',
                  '--add-header', 'Connection: keep-alive',
                  '--add-header', 'Sec-Ch-Ua: "Not_A Brand";v="8", "Chromium";v="120", "Google Chrome";v="120"',
                  '--add-header', 'Sec-Ch-Ua-Mobile: ?0',
                  '--add-header', 'Sec-Ch-Ua-Platform: "Windows"',
                  '--add-header', 'Sec-Fetch-Dest: document',
                  '--add-header', 'Sec-Fetch-Mode: navigate',
                  '--add-header', 'Sec-Fetch-Site: none',
                  '--add-header', 'Sec-Fetch-User: ?1',
                  '--add-header', 'Upgrade-Insecure-Requests: 1',
                  '--retries', '5',
                  '--fragment-retries', '5',
                  '--sleep-requests', '2',
                  '--sleep-interval', '3',
                  '--max-sleep-interval', '5',
                  url
              ]
              
              result = subprocess.run(cmd, capture_output=True, text=True)
              return result.returncode == 0, result.stderr

          raw_input = os.environ.get('URLS_INPUT', '')
          urls = re.split(r'[,\s\n]+', raw_input)
          urls = [u.strip() for u in urls if u.strip() and u.strip().startswith('http')]
          
          print(f"🔍 تعداد لینک‌های دریافتی: {len(urls)}")
          
          success_count = 0
          fail_count = 0
          
          for idx, url in enumerate(urls, 1):
              print(f"\n📥 پردازش {idx}/{len(urls)}: {url}")
              
              # ابتدا عنوان ویدیو را دریافت می‌کنیم
              cmd_info = [
                  'yt-dlp', '--get-title', '--no-warnings',
                  '--impersonate', 'chrome-120', url
              ]
              result = subprocess.run(cmd_info, capture_output=True, text=True)
              
              if result.returncode != 0:
                  print(f"   ❌ خطا: {result.stderr[:200]}")
                  fail_count += 1
                  continue
              
              title = result.stdout.strip()
              if not title:
                  title = f"video_{idx}"
              
              safe_title = sanitize_filename(title)
              output_template = f"dl/{safe_title}.%(ext)s"
              
              success, error = download_with_ytdlp(url, output_template)
              
              if success:
                  # بررسی فایل‌های دانلود شده
                  for f in os.listdir('dl'):
                      if f.startswith(safe_title) or (f.endswith('.mp4') and idx in f):
                          old_path = os.path.join('dl', f)
                          new_path = get_unique_filename(old_path)
                          if old_path != new_path:
                              os.rename(old_path, new_path)
                              print(f"   ✅ دانلود شد: {os.path.basename(new_path)}")
                          else:
                              print(f"   ✅ دانلود شد: {f}")
                          success_count += 1
                          break
                  else:
                      print(f"   ⚠️ دانلود شد اما فایل یافت نشد")
                      success_count += 1
              else:
                  print(f"   ❌ خطا در دانلود: {error[:200]}")
                  fail_count += 1
              
              time.sleep(2)  # تأخیر بین درخواست‌ها
          
          print(f"\n📊 خلاصه: {success_count} موفق, {fail_count} ناموفق")
          EOF
        env:
          URLS_INPUT: ${{ github.event.inputs.urls }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded videos [skip ci]" || echo "No changes to commit"
          git push
