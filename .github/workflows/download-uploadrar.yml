name: Advanced UploadRAR Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "UploadRAR URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            playwright \
            requests \
            cloudscraper \
            fake-useragent

          playwright install chromium

      - name: Download from UploadRAR
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'

          import asyncio
          import os
          import re
          import time
          import random
          import requests
          import cloudscraper

          from pathlib import Path
          from urllib.parse import urlparse

          from fake_useragent import UserAgent

          from playwright.async_api import async_playwright

          DOWNLOAD_DIR = Path("dl")
          DOWNLOAD_DIR.mkdir(exist_ok=True)

          ua = UserAgent()

          FILE_REGEX = re.compile(
              r'\.(zip|rar|7z|mp4|mkv|avi|pdf|exe)(\?|$)',
              re.I
          )

          BLOCKED_WORDS = [
              "register",
              "login",
              "telegram",
              "facebook",
              "twitter",
              "instagram",
              "ads",
              "popup",
              "javascript:"
          ]

          ############################################################
          # HELPERS
          ############################################################

          def random_sleep(a=1, b=3):
              time.sleep(random.uniform(a, b))

          def is_valid_link(url):

              if not url:
                  return False

              lower = url.lower()

              if any(x in lower for x in BLOCKED_WORDS):
                  return False

              return bool(FILE_REGEX.search(url))

          def filename_from_url(url):

              parsed = urlparse(url)

              name = os.path.basename(parsed.path)

              if not name:
                  name = "downloaded_file"

              return name

          ############################################################
          # REQUESTS DOWNLOADER
          ############################################################

          def direct_download(url):

              print(f"[REQUESTS] Downloading: {url}")

              scraper = cloudscraper.create_scraper()

              headers = {
                  "User-Agent": ua.random,
                  "Referer": "https://uploadrar.com/"
              }

              response = scraper.get(
                  url,
                  headers=headers,
                  stream=True,
                  timeout=120
              )

              response.raise_for_status()

              filename = filename_from_url(url)

              filepath = DOWNLOAD_DIR / filename

              with open(filepath, "wb") as f:

                  for chunk in response.iter_content(chunk_size=1024 * 1024):

                      if chunk:
                          f.write(chunk)

              print(f"[REQUESTS] Saved: {filepath}")

              return True

          ############################################################
          # PLAYWRIGHT
          ############################################################

          async def close_ads(context, main_page):

              for p in context.pages:

                  if p != main_page:

                      try:
                          print("[BROWSER] Closing popup/ad page")
                          await p.close()

                      except:
                          pass

          async def wait_countdown(page):

              try:

                  el = page.locator("#seconds")

                  txt = await el.inner_text(timeout=5000)

                  seconds = int(txt.strip())

                  print(f"[COUNTDOWN] {seconds}s")

                  for i in range(seconds, 0, -1):

                      print(f"Waiting {i}s")

                      await page.wait_for_timeout(1000)

              except:

                  print("[COUNTDOWN] Not found")

          async def click_free(page):

              selectors = [
                  'button[name="method_free"]',
                  'input[name="method_free"]',
                  'button:has-text("Free Download")',
                  'a:has-text("Free Download")',
                  '.btn-free',
                  '#method_free'
              ]

              for selector in selectors:

                  try:

                      locator = page.locator(selector)

                      if await locator.count() > 0:

                          print(f"[CLICK] {selector}")

                          await locator.first.click()

                          await page.wait_for_timeout(3000)

                          return True

                  except:
                      pass

              return False

          async def sniff_download_link(page):

              print("[SNIFF] Listening for file URLs...")

              found = {
                  "url": None
              }

              def handle_response(response):

                  try:

                      url = response.url

                      if is_valid_link(url):

                          print(f"[NETWORK] File URL found: {url}")

                          found["url"] = url

                  except:
                      pass

              page.on("response", handle_response)

              await page.wait_for_timeout(10000)

              return found["url"]

          async def extract_links(page):

              print("[EXTRACT] Searching links in HTML")

              links = await page.query_selector_all("a")

              for link in links:

                  try:

                      href = await link.get_attribute("href")

                      if is_valid_link(href):

                          print(f"[EXTRACT] Valid URL: {href}")

                          return href

                  except:
                      pass

              return None

          async def playwright_download(page_url):

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )

                  context = await browser.new_context(
                      accept_downloads=True,
                      user_agent=ua.random,
                      viewport={"width": 1366, "height": 768}
                  )

                  page = await context.new_page()

                  print(f"[OPEN] {page_url}")

                  await page.goto(
                      page_url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  await close_ads(context, page)

                  await click_free(page)

                  await wait_countdown(page)

                  await close_ads(context, page)

                  ####################################################
                  # METHOD 1: NETWORK SNIFF
                  ####################################################

                  link = await sniff_download_link(page)

                  ####################################################
                  # METHOD 2: HTML EXTRACTION
                  ####################################################

                  if not link:

                      link = await extract_links(page)

                  if not link:

                      print("[ERROR] No real download link found")

                      await browser.close()

                      return False

                  print(f"[FOUND] {link}")

                  ####################################################
                  # METHOD 3: REQUESTS DOWNLOAD
                  ####################################################

                  try:

                      direct_download(link)

                      await browser.close()

                      return True

                  except Exception as e:

                      print("[REQUESTS FAILED]", e)

                  ####################################################
                  # METHOD 4: PLAYWRIGHT DOWNLOAD FALLBACK
                  ####################################################

                  try:

                      async with page.expect_download(
                          timeout=120000
                      ) as download_info:

                          await page.goto(link)

                      download = await download_info.value

                      filename = download.suggested_filename

                      path = DOWNLOAD_DIR / filename

                      await download.save_as(path)

                      print(f"[PLAYWRIGHT] Saved: {path}")

                      await browser.close()

                      return True

                  except Exception as e:

                      print("[PLAYWRIGHT FAILED]", e)

                      await browser.close()

                      return False

          ############################################################
          # RETRY SYSTEM
          ############################################################

          async def main():

              page_url = os.environ["PAGE_URL"]

              retries = 3

              for attempt in range(1, retries + 1):

                  try:

                      print(f"\n========== ATTEMPT {attempt} ==========\n")

                      success = await playwright_download(page_url)

                      if success:

                          print("\nSUCCESS\n")

                          return True

                  except Exception as e:

                      print(f"[ATTEMPT FAILED] {e}")

                  wait_time = attempt * 10

                  print(f"Retrying in {wait_time}s")

                  await asyncio.sleep(wait_time)

              return False

          success = asyncio.run(main())

          if not success:
              raise SystemExit(1)

          EOF

      - name: List downloaded files
        run: |
          echo "Downloaded files:"
          ls -lah dl || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes"

          git push
