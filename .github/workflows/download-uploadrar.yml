name: Download from UploadRAR with Playwright

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of UploadRAR download page (e.g. https://uploadrar.com/xxxxx)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Download from UploadRAR
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'
          import asyncio
          import os
          import re
          from playwright.async_api import async_playwright

          async def download_from_uploadrar(page_url):
              async with async_playwright() as p:
                  # Launch browser
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  )
                  page = await context.new_page()
                  
                  print(f"Navigating to {page_url}")
                  await page.goto(page_url)
                  
                  # Click the "Free Download" button if exists
                  free_btn = await page.query_selector('button[name="method_free"]')
                  if free_btn:
                      print("Clicking Free Download button...")
                      await free_btn.click()
                      await page.wait_for_timeout(3000)  # wait for response
                  
                  # Check for countdown
                  countdown_span = await page.query_selector('#seconds')
                  if countdown_span:
                      countdown_text = await countdown_span.inner_text()
                      try:
                          wait_time = int(countdown_text.strip())
                          print(f"Countdown: {wait_time} seconds")
                          for remaining in range(wait_time, 0, -1):
                              print(f"\rWaiting {remaining} seconds...", end='', flush=True)
                              await page.wait_for_timeout(1000)
                          print()
                      except:
                          pass
                  
                  # Wait for download button to appear
                  print("Looking for download link...")
                  await page.wait_for_timeout(5000)
                  
                  # Find the download link
                  download_link = None
                  
                  # Try to find button with 'btn-primary' class
                  download_btn = await page.query_selector('a.btn-primary')
                  if download_btn:
                      href = await download_btn.get_attribute('href')
                      if href:
                          download_link = href
                  
                  # Fallback: find any link containing .rar or .zip
                  if not download_link:
                      links = await page.query_selector_all('a')
                      for link in links:
                          href = await link.get_attribute('href')
                          if href and re.search(r'\.(rar|zip|mp4|exe|pdf|7z)', href, re.I):
                              download_link = href
                              break
                  
                  if not download_link:
                      print("Could not find download link.")
                      await browser.close()
                      return False
                  
                  print(f"Download link found: {download_link}")
                  
                  # Create dl directory and download file
                  os.makedirs('dl', exist_ok=True)
                  output_file = 'dl/downloaded_file.rar'
                  
                  # Use page context to download the file
                  async with page.expect_download() as download_info:
                      await page.goto(download_link)
                  download = await download_info.value
                  
                  # Save the file
                  await download.save_as(output_file)
                  print(f"File downloaded to {output_file}")
                  
                  await browser.close()
                  return True
          
          success = asyncio.run(download_from_uploadrar(os.environ['PAGE_URL']))
          if not success:
              exit(1)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded file from UploadRAR [skip ci]" || echo "No changes to commit"
          git push
