name: UploadRAR Deep Sniffer

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "UploadRAR URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Download
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'

          import asyncio
          import os
          import requests
          from urllib.parse import unquote, urlparse

          from playwright.async_api import async_playwright

          FILE_URL = None

          async def main():

              global FILE_URL

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context(
                      accept_downloads=True
                  )

                  ##################################################
                  # GLOBAL REQUEST LOGGER
                  ##################################################

                  async def handle_request(request):

                      global FILE_URL

                      url = request.url

                      print(f"[REQ] {url}")

                      lower = url.lower()

                      if (
                          "uploadrar.com:183" in lower
                          or lower.endswith(".rar")
                          or lower.endswith(".zip")
                          or lower.endswith(".7z")
                      ):

                          print(f"\n[FOUND FILE]\n{url}\n")

                          FILE_URL = url

                  context.on(
                      "request",
                      handle_request
                  )

                  ##################################################
                  # POPUP CAPTURE
                  ##################################################

                  async def popup_handler(popup):

                      print("[POPUP OPENED]")

                      async def popup_req(req):

                          global FILE_URL

                          url = req.url

                          print(f"[POPUP REQ] {url}")

                          lower = url.lower()

                          if (
                              "uploadrar.com:183" in lower
                              or ".rar" in lower
                              or ".zip" in lower
                          ):

                              print(f"\n[FOUND IN POPUP]\n{url}\n")

                              FILE_URL = url

                      popup.on(
                          "request",
                          popup_req
                      )

                  page = await context.new_page()

                  page.on("popup", popup_handler)

                  ##################################################

                  page_url = os.environ["PAGE_URL"]

                  print(f"Opening: {page_url}")

                  await page.goto(
                      page_url,
                      wait_until="networkidle",
                      timeout=120000
                  )

                  ##################################################
                  # CLICK FREE
                  ##################################################

                  selectors = [
                      'button[name="method_free"]',
                      'input[name="method_free"]',
                      'button:has-text("Free Download")'
                  ]

                  for selector in selectors:

                      try:

                          locator = page.locator(selector)

                          if await locator.count() > 0:

                              print(f"Clicking: {selector}")

                              await locator.first.click()

                              break

                      except:
                          pass

                  ##################################################
                  # WAIT COUNTDOWN
                  ##################################################

                  try:

                      txt = await page.locator(
                          "#seconds"
                      ).inner_text(timeout=5000)

                      seconds = int(txt.strip())

                      print(f"Countdown: {seconds}s")

                      await page.wait_for_timeout(
                          seconds * 1000
                      )

                  except:
                      pass

                  ##################################################
                  # FORCE USER ACTIONS
                  ##################################################

                  for _ in range(5):

                      await page.mouse.move(400, 400)

                      await page.mouse.click(400, 400)

                      await page.wait_for_timeout(2000)

                  ##################################################

                  await page.wait_for_timeout(15000)

                  ##################################################

                  if not FILE_URL:

                      raise Exception(
                          "No real file URL captured"
                      )

                  ##################################################
                  # DOWNLOAD
                  ##################################################

                  os.makedirs("dl", exist_ok=True)

                  filename = os.path.basename(
                      urlparse(FILE_URL).path
                  )

                  filename = unquote(filename)

                  if not filename:
                      filename = "download.bin"

                  save_path = os.path.join(
                      "dl",
                      filename
                  )

                  cookies = await context.cookies()

                  cookie_header = "; ".join(
                      f"{c['name']}={c['value']}"
                      for c in cookies
                  )

                  headers = {
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64)"
                      ),
                      "Referer": "https://uploadrar.com/",
                      "Cookie": cookie_header
                  }

                  print(f"Downloading: {FILE_URL}")

                  response = requests.get(
                      FILE_URL,
                      headers=headers,
                      stream=True,
                      timeout=300,
                      allow_redirects=True
                  )

                  print(
                      "STATUS:",
                      response.status_code
                  )

                  print(
                      "CONTENT:",
                      response.headers.get(
                          "content-type"
                      )
                  )

                  with open(save_path, "wb") as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):

                          if chunk:
                              f.write(chunk)

                  print(f"Saved: {save_path}")

                  await browser.close()

          asyncio.run(main())

          EOF

      - name: Show Files
        run: |
          ls -lah dl || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes"

          git push
