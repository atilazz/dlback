name: UploadRAR Downloader Stable

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'UploadRAR URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            playwright \
            requests \
            cloudscraper

          playwright install chromium

      - name: Download File
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'

          import asyncio
          import os
          import re
          import requests
          import cloudscraper

          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          DOWNLOAD_DIR = "dl"

          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          FILE_EXTENSIONS = (
              ".rar",
              ".zip",
              ".7z",
              ".mp4",
              ".mkv",
              ".avi",
              ".pdf",
              ".exe"
          )

          BLOCKED_DOMAINS = [
              "register",
              "login",
              "facebook",
              "twitter",
              "telegram",
              "instagram",
              "doubleclick",
              "googlesyndication",
              "sheriffcybanninguntackle"
          ]

          ##########################################################

          def is_real_file_response(response):

              content_type = response.headers.get(
                  "content-type",
                  ""
              ).lower()

              content_disposition = response.headers.get(
                  "content-disposition",
                  ""
              ).lower()

              if "text/html" in content_type:
                  return False

              if "attachment" in content_disposition:
                  return True

              if "application" in content_type:
                  return True

              if "video" in content_type:
                  return True

              return False

          ##########################################################

          def try_direct_download(url):

              print(f"[REQUESTS] Testing: {url}")

              scraper = cloudscraper.create_scraper()

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "Chrome/120 Safari/537.36"
                  ),
                  "Referer": "https://uploadrar.com/"
              }

              response = scraper.get(
                  url,
                  headers=headers,
                  allow_redirects=True,
                  stream=True,
                  timeout=120
              )

              final_url = response.url

              print(f"[REQUESTS] Final URL: {final_url}")

              if not is_real_file_response(response):

                  print("[REQUESTS] Not a real file")

                  return False

              filename = None

              cd = response.headers.get(
                  "content-disposition",
                  ""
              )

              match = re.search(
                  r'filename="?([^"]+)"?',
                  cd
              )

              if match:
                  filename = match.group(1)

              if not filename:

                  parsed = urlparse(final_url)

                  filename = os.path.basename(parsed.path)

              if not filename:
                  filename = "downloaded_file.bin"

              save_path = os.path.join(
                  DOWNLOAD_DIR,
                  filename
              )

              print(f"[REQUESTS] Saving to {save_path}")

              with open(save_path, "wb") as f:

                  for chunk in response.iter_content(
                      chunk_size=1024 * 1024
                  ):

                      if chunk:
                          f.write(chunk)

              print("[REQUESTS] Download completed")

              return True

          ##########################################################

          async def wait_countdown(page):

              try:

                  seconds = await page.locator(
                      "#seconds"
                  ).inner_text(timeout=5000)

                  wait_time = int(seconds.strip())

                  print(f"Countdown: {wait_time}s")

                  await page.wait_for_timeout(
                      wait_time * 1000
                  )

              except:

                  print("No countdown")

          ##########################################################

          async def click_free(page):

              selectors = [
                  'button[name="method_free"]',
                  'input[name="method_free"]',
                  'button:has-text("Free Download")'
              ]

              for selector in selectors:

                  try:

                      locator = page.locator(selector)

                      if await locator.count() > 0:

                          print(f"Clicking: {selector}")

                          await locator.first.click()

                          await page.wait_for_timeout(3000)

                          return

                  except:
                      pass

          ##########################################################

          async def extract_real_links(page):

              links = await page.query_selector_all("a")

              valid_links = []

              for link in links:

                  try:

                      href = await link.get_attribute("href")

                      if not href:
                          continue

                      lower = href.lower()

                      if any(
                          x in lower
                          for x in BLOCKED_DOMAINS
                      ):
                          continue

                      if any(
                          ext in lower
                          for ext in FILE_EXTENSIONS
                      ):

                          valid_links.append(href)

                  except:
                      pass

              return valid_links

          ##########################################################

          async def main():

              page_url = os.environ["PAGE_URL"]

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context()

                  page = await context.new_page()

                  print(f"Opening page: {page_url}")

                  await page.goto(
                      page_url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  await click_free(page)

                  await wait_countdown(page)

                  print("Extracting links...")

                  links = await extract_real_links(page)

                  print(f"Found {len(links)} candidate links")

                  for link in links:

                      print(f"Testing link: {link}")

                      try:

                          success = try_direct_download(link)

                          if success:

                              print("SUCCESS")

                              await browser.close()

                              return

                      except Exception as e:

                          print("FAILED:", e)

                  await browser.close()

                  raise Exception(
                      "No valid downloadable file found"
                  )

          asyncio.run(main())

          EOF

      - name: Show files
        run: |
          ls -lah dl || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes"

          git push
