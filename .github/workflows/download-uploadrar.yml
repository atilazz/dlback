name: Download from UploadRAR with yt-dlp

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of UploadRAR download page'
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install yt-dlp
        run: |
          pip install yt-dlp
      
      - name: Download file
        run: |
          mkdir -p dl
          yt-dlp -o "dl/%(title)s.%(ext)s" "${{ github.event.inputs.page_url }}"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Download from UploadRAR [skip ci]" || echo "No changes"
          git push
