name: Download from UploadRAR with Playwright

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'UploadRAR page URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Download file from UploadRAR
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'
          import asyncio
          import os
          import re
          from playwright.async_api import async_playwright

          DOWNLOAD_DIR = "dl"

          async def close_extra_pages(context, main_page):
              for p in context.pages:
                  if p != main_page:
                      try:
                          await p.close()
                      except:
                          pass

          async def wait_countdown(page):

              try:
                  seconds_el = page.locator("#seconds")

                  txt = await seconds_el.inner_text(timeout=5000)

                  wait_time = int(txt.strip())

                  print(f"Countdown detected: {wait_time}s")

                  for i in range(wait_time, 0, -1):
                      print(f"Waiting {i}s...")
                      await page.wait_for_timeout(1000)

              except:
                  print("No countdown found")

          async def click_free_download(page):

              selectors = [
                  'button[name="method_free"]',
                  'input[name="method_free"]',
                  'button:has-text("Free Download")',
                  'a:has-text("Free Download")'
              ]

              for selector in selectors:

                  try:
                      btn = page.locator(selector)

                      if await btn.count() > 0:

                          print(f"Clicking free button: {selector}")

                          await btn.first.click()

                          await page.wait_for_timeout(3000)

                          return True

                  except:
                      pass

              print("Free download button not found")
              return False

          async def find_real_download_link(page):

              print("Searching for real download link...")

              await page.wait_for_timeout(5000)

              links = await page.query_selector_all("a")

              for link in links:

                  try:
                      href = await link.get_attribute("href")

                      if not href:
                          continue

                      href = href.strip()

                      lower = href.lower()

                      # Skip fake/ad links
                      blocked = [
                          "/register",
                          "/login",
                          "facebook",
                          "twitter",
                          "telegram",
                          "instagram",
                          "javascript:",
                          "#"
                      ]

                      if any(x in lower for x in blocked):
                          continue

                      # Accept file-like links
                      if re.search(
                          r'\.(rar|zip|7z|mp4|mkv|avi|pdf|exe)(\?|$)',
                          href,
                          re.I
                      ):
                          print(f"Found file link: {href}")
                          return href

                  except:
                      pass

              return None

          async def download_file(page, link):

              os.makedirs(DOWNLOAD_DIR, exist_ok=True)

              print("Starting download...")

              try:

                  async with page.expect_download(timeout=120000) as download_info:

                      await page.goto(link)

                  download = await download_info.value

                  filename = download.suggested_filename

                  save_path = os.path.join(DOWNLOAD_DIR, filename)

                  await download.save_as(save_path)

                  print(f"Downloaded successfully: {save_path}")

                  return True

              except Exception as e:

                  print("Download error:", e)

                  return False

          async def main():

              page_url = os.environ["PAGE_URL"]

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--disable-blink-features=AutomationControlled",
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context(
                      accept_downloads=True,
                      viewport={"width": 1366, "height": 768},
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/120.0.0.0 Safari/537.36"
                      )
                  )

                  page = await context.new_page()

                  print(f"Opening page: {page_url}")

                  try:

                      await page.goto(
                          page_url,
                          wait_until="domcontentloaded",
                          timeout=120000
                      )

                  except Exception as e:

                      print("Page open failed:", e)

                      await browser.close()

                      return False

                  await close_extra_pages(context, page)

                  await click_free_download(page)

                  await wait_countdown(page)

                  await close_extra_pages(context, page)

                  real_link = await find_real_download_link(page)

                  if not real_link:

                      print("Could not find real download link")

                      await browser.close()

                      return False

                  success = await download_file(page, real_link)

                  await browser.close()

                  return success

          success = asyncio.run(main())

          if not success:
              raise SystemExit(1)

          EOF

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          ls -lah dl || true

      - name: Commit and push downloaded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes to commit"

          git push
