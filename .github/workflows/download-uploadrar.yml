name: UploadRAR Final Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: "UploadRAR URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            playwright \
            requests

          playwright install chromium

      - name: Download File
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'

          import asyncio
          import os
          import re
          import requests

          from urllib.parse import unquote, urlparse
          from playwright.async_api import async_playwright

          DOWNLOAD_DIR = "dl"

          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          ##########################################################

          FILE_URL = None

          ##########################################################

          def filename_from_url(url):

              path = urlparse(url).path

              name = os.path.basename(path)

              name = unquote(name)

              if not name:
                  name = "download.bin"

              return name

          ##########################################################

          async def click_free(page):

              selectors = [
                  'button[name="method_free"]',
                  'input[name="method_free"]',
                  'button:has-text("Free Download")',
                  'a:has-text("Free Download")'
              ]

              for selector in selectors:

                  try:

                      locator = page.locator(selector)

                      if await locator.count() > 0:

                          print(f"Clicking: {selector}")

                          await locator.first.click()

                          await page.wait_for_timeout(3000)

                          return True

                  except:
                      pass

              return False

          ##########################################################

          async def wait_countdown(page):

              try:

                  txt = await page.locator(
                      "#seconds"
                  ).inner_text(timeout=5000)

                  seconds = int(txt.strip())

                  print(f"Countdown: {seconds}s")

                  for i in range(seconds, 0, -1):

                      print(f"Waiting {i}s")

                      await page.wait_for_timeout(1000)

              except:

                  print("No countdown")

          ##########################################################

          async def main():

              global FILE_URL

              page_url = os.environ["PAGE_URL"]

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage",
                          "--disable-blink-features=AutomationControlled"
                      ]
                  )

                  context = await browser.new_context(
                      accept_downloads=True,
                      user_agent=(
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/148.0.0.0 Safari/537.36"
                      )
                  )

                  page = await context.new_page()

                  ##################################################
                  # NETWORK SNIFFER
                  ##################################################

                  async def handle_response(response):

                      global FILE_URL

                      try:

                          url = response.url.lower()

                          if (
                              "uploadrar.com:183" in url
                              and (
                                  ".rar" in url
                                  or ".zip" in url
                                  or ".7z" in url
                              )
                          ):

                              print(f"[FOUND FILE URL]")
                              print(response.url)

                              FILE_URL = response.url

                      except:
                          pass

                  page.on("response", handle_response)

                  ##################################################

                  print(f"Opening: {page_url}")

                  await page.goto(
                      page_url,
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  await click_free(page)

                  await wait_countdown(page)

                  ##################################################
                  # Trigger requests
                  ##################################################

                  await page.mouse.move(500, 400)

                  await page.mouse.click(500, 400)

                  await page.wait_for_timeout(15000)

                  ##################################################

                  if not FILE_URL:

                      raise Exception(
                          "Real file URL not found"
                      )

                  ##################################################
                  # GET COOKIES
                  ##################################################

                  cookies = await context.cookies()

                  cookie_header = "; ".join(
                      f"{c['name']}={c['value']}"
                      for c in cookies
                  )

                  ##################################################
                  # DOWNLOAD
                  ##################################################

                  headers = {
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/148.0.0.0 Safari/537.36"
                      ),
                      "Referer": "https://uploadrar.com/",
                      "Cookie": cookie_header
                  }

                  print("Downloading real file...")

                  response = requests.get(
                      FILE_URL,
                      headers=headers,
                      stream=True,
                      timeout=300,
                      allow_redirects=True
                  )

                  print("Status:", response.status_code)

                  content_type = response.headers.get(
                      "content-type",
                      ""
                  )

                  print("Content-Type:", content_type)

                  if "text/html" in content_type.lower():

                      raise Exception(
                          "Server returned HTML instead of file"
                      )

                  filename = filename_from_url(FILE_URL)

                  save_path = os.path.join(
                      DOWNLOAD_DIR,
                      filename
                  )

                  with open(save_path, "wb") as f:

                      for chunk in response.iter_content(
                          chunk_size=1024 * 1024
                      ):

                          if chunk:
                              f.write(chunk)

                  print(f"Saved: {save_path}")

                  await browser.close()

          asyncio.run(main())

          EOF

      - name: Show files
        run: |
          ls -lah dl || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes"

          git push
