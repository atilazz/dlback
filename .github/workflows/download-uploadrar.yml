name: UploadRAR Network Sniffer Downloader

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'UploadRAR URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            playwright \
            requests \
            cloudscraper

          playwright install chromium

      - name: Download
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'

          import asyncio
          import os
          import re
          import requests
          import cloudscraper

          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          DOWNLOAD_DIR = "dl"

          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          ##########################################################

          FILE_PATTERNS = [
              ".rar",
              ".zip",
              ".7z",
              ".mp4",
              ".mkv",
              ".avi",
              ".pdf",
              ".exe"
          ]

          BLOCKED = [
              "register",
              "login",
              "facebook",
              "twitter",
              "telegram",
              "instagram",
              "doubleclick",
              "googlesyndication",
              "ads"
          ]

          ##########################################################

          def looks_like_file(url):

              if not url:
                  return False

              lower = url.lower()

              if any(x in lower for x in BLOCKED):
                  return False

              return any(x in lower for x in FILE_PATTERNS)

          ##########################################################

          def direct_download(url):

              print(f"[DOWNLOAD] {url}")

              scraper = cloudscraper.create_scraper()

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64)"
                  ),
                  "Referer": "https://uploadrar.com/"
              }

              response = scraper.get(
                  url,
                  headers=headers,
                  stream=True,
                  allow_redirects=True,
                  timeout=120
              )

              content_type = response.headers.get(
                  "content-type",
                  ""
              ).lower()

              print("[CONTENT-TYPE]", content_type)

              if "text/html" in content_type:

                  raise Exception(
                      "Got HTML page instead of file"
                  )

              filename = None

              cd = response.headers.get(
                  "content-disposition",
                  ""
              )

              m = re.search(
                  r'filename="?([^"]+)"?',
                  cd
              )

              if m:
                  filename = m.group(1)

              if not filename:

                  parsed = urlparse(response.url)

                  filename = os.path.basename(parsed.path)

              if not filename:
                  filename = "download.bin"

              save_path = os.path.join(
                  DOWNLOAD_DIR,
                  filename
              )

              with open(save_path, "wb") as f:

                  for chunk in response.iter_content(
                      chunk_size=1024 * 1024
                  ):

                      if chunk:
                          f.write(chunk)

              print(f"[SAVED] {save_path}")

          ##########################################################

          async def click_free(page):

              selectors = [
                  'button[name="method_free"]',
                  'input[name="method_free"]',
                  'button:has-text("Free Download")'
              ]

              for selector in selectors:

                  try:

                      locator = page.locator(selector)

                      if await locator.count() > 0:

                          print(f"Clicking: {selector}")

                          await locator.first.click()

                          await page.wait_for_timeout(3000)

                          return

                  except:
                      pass

          ##########################################################

          async def wait_countdown(page):

              try:

                  txt = await page.locator(
                      "#seconds"
                  ).inner_text(timeout=5000)

                  seconds = int(txt.strip())

                  print(f"Countdown: {seconds}s")

                  await page.wait_for_timeout(
                      seconds * 1000
                  )

              except:

                  print("No countdown")

          ##########################################################

          async def main():

              page_url = os.environ["PAGE_URL"]

              found_urls = []

              async with async_playwright() as p:

                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                      ]
                  )

                  context = await browser.new_context(
                      accept_downloads=True
                  )

                  page = await context.new_page()

                  ##################################################
                  # NETWORK SNIFFER
                  ##################################################

                  async def handle_response(response):

                      try:

                          url = response.url

                          if looks_like_file(url):

                              print(f"[NETWORK] {url}")

                              found_urls.append(url)

                      except:
                          pass

                  page.on(
                      "response",
                      handle_response
                  )

                  ##################################################

                  print(f"Opening page: {page_url}")

                  await page.goto(
                      page_url,
                      wait_until="networkidle",
                      timeout=120000
                  )

                  await click_free(page)

                  await wait_countdown(page)

                  ##################################################
                  # Trigger JS
                  ##################################################

                  await page.mouse.move(300, 400)

                  await page.mouse.click(300, 400)

                  await page.wait_for_timeout(10000)

                  ##################################################

                  await browser.close()

              ######################################################
              # REMOVE DUPLICATES
              ######################################################

              unique = []

              for u in found_urls:

                  if u not in unique:
                      unique.append(u)

              print(f"Found {len(unique)} URLs")

              ######################################################
              # TRY DOWNLOAD
              ######################################################

              for url in unique:

                  try:

                      direct_download(url)

                      print("SUCCESS")

                      return

                  except Exception as e:

                      print("FAILED:", e)

              raise Exception(
                  "No downloadable file found"
              )

          asyncio.run(main())

          EOF

      - name: Show files
        run: |
          ls -lah dl || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dl/

          git commit -m "Add downloaded file [skip ci]" || echo "No changes"

          git push
