import asyncio
from playwright.async_api import async_playwright

URL = "https://uploadrar.com/lsy90ncgkak3"


async def wait_cloudflare(context, timeout=60):
    print("Waiting for Cloudflare clearance...")

    for i in range(timeout):
        cookies = await context.cookies()

        for c in cookies:
            if c["name"] == "cf_clearance":
                print("Cloudflare solved")
                return

        await asyncio.sleep(1)

    raise Exception("Cloudflare challenge not solved")


async def main():
    async with async_playwright() as p:

        context = await p.chromium.launch_persistent_context(
            user_data_dir="./chrome_profile",

            headless=False,

            accept_downloads=True,

            viewport={
                "width": 1280,
                "height": 720
            },

            user_agent=(
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                "AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/147.0.0.0 Safari/537.36"
            ),

            args=[
                "--disable-blink-features=AutomationControlled",
                "--start-maximized",
            ]
        )

        page = await context.new_page()

        #
        # DEBUG LOGS
        #

        page.on(
            "request",
            lambda r: print(f"[REQ] {r.method} {r.url}")
        )

        page.on(
            "response",
            lambda r: print(f"[RES] {r.status} {r.url}")
        )

        page.on(
            "download",
            lambda d: print(
                f"[DOWNLOAD] {d.suggested_filename}"
            )
        )

        print(f"Opening: {URL}")

        await page.goto(
            URL,
            wait_until="domcontentloaded",
            timeout=120000
        )

        #
        # WAIT FOR CLOUDFLARE
        #

        await wait_cloudflare(context)

        #
        # WAIT PAGE FULLY READY
        #

        await page.wait_for_load_state("networkidle")

        await page.wait_for_timeout(5000)

        #
        # CLICK FREE METHOD BUTTON
        #

        free_btn = page.locator(
            'button[name="method_free"]'
        )

        await free_btn.wait_for(timeout=60000)

        print("Clicking: method_free")

        await free_btn.click()

        #
        # COUNTDOWN
        #

        for i in range(8, 0, -1):
            print(f"Waiting {i}s")
            await asyncio.sleep(1)

        #
        # WAIT BUTTON APPEAR
        #

        download_btn = page.locator(
            'button:has-text("Free Download")'
        )

        await download_btn.wait_for(
            timeout=120000
        )

        print("Clicking: Free Download")

        #
        # CAPTURE DOWNLOAD
        #

        try:

            async with page.expect_download(
                timeout=120000
            ) as download_info:

                await download_btn.click()

            download = await download_info.value

            print(
                f"Download started: "
                f"{download.suggested_filename}"
            )

            save_path = (
                f"./{download.suggested_filename}"
            )

            await download.save_as(save_path)

            print(f"Saved: {save_path}")

        except Exception as e:

            print(
                f"No direct download detected: {e}"
            )

            #
            # TRY POPUP
            #

            try:

                async with page.expect_popup(
                    timeout=30000
                ) as popup_info:

                    await download_btn.click()

                popup = await popup_info.value

                await popup.wait_for_load_state()

                print(
                    f"Popup URL: {popup.url}"
                )

            except Exception as ex:
                print(
                    f"Popup also failed: {ex}"
                )

        #
        # KEEP OPEN
        #

        print("Done")

        await page.wait_for_timeout(30000)

        await context.close()


asyncio.run(main())
