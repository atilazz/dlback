name: Download from UploadRAR

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of UploadRAR download page'
        required: true
        type: string
        default: 'https://uploadrar.com/lsy90ncgkak3'
      filename:
        description: 'Output filename (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Download file from UploadRAR
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
          OUTPUT_NAME: ${{ github.event.inputs.filename }}
        run: |
          python << 'EOF'
          import requests
          import time
          import re
          import os
          import json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          def extract_filename_from_url(url):
              parsed = urlparse(url)
              path = parsed.path
              filename = path.split('/')[-1]
              if not filename:
                  filename = 'downloaded_file'
              return filename

          def download_from_uploadrar(page_url, output_filename=None):
              # Headers to mimic a real browser
              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Referer': 'https://uploadrar.com/',
                  'Origin': 'https://uploadrar.com',
              }
              session = requests.Session()
              session.headers.update(headers)

              try:
                  # 1. Get the initial download page to extract file ID and other info
                  print(f"Fetching page: {page_url}")
                  resp = session.get(page_url, timeout=30)
                  resp.raise_for_status()
                  soup = BeautifulSoup(resp.text, 'html.parser')
                  
                  # Extract file ID from URL or page
                  # The page URL looks like https://uploadrar.com/CODE
                  file_code = page_url.rstrip('/').split('/')[-1]
                  print(f"File code: {file_code}")
                  
                  # Also check for a meta tag or JavaScript that might contain the file ID
                  # Look for the download link form
                  
                  # 2. Try the AJAX endpoint (common in XFileSharing sites)
                  # First attempt: GET request to /dl/{file_code}
                  ajax_url = f"https://uploadrar.com/dl/{file_code}"
                  print(f"Trying AJAX URL: {ajax_url}")
                  
                  # This might return JSON with the download link or a redirect
                  ajax_resp = session.get(ajax_url, headers=headers, allow_redirects=False)
                  
                  direct_link = None
                  
                  if ajax_resp.status_code == 302:
                      # Redirect to download link
                      direct_link = ajax_resp.headers.get('Location')
                      print(f"Redirect found: {direct_link}")
                  elif ajax_resp.status_code == 200:
                      try:
                          data = ajax_resp.json()
                          if 'url' in data:
                              direct_link = data['url']
                              print(f"JSON response contains download URL")
                          elif 'download_url' in data:
                              direct_link = data['download_url']
                      except:
                          # Not JSON, look for download link in response text
                          soup2 = BeautifulSoup(ajax_resp.text, 'html.parser')
                          # Look for any link with .rar or .zip
                          for link in soup2.find_all('a', href=True):
                              href = link['href']
                              if any(ext in href.lower() for ext in ['.rar', '.zip', '.mp4', '.exe', '.pdf', '.7z']):
                                  direct_link = href
                                  break
                  else:
                      print(f"AJAX returned status {ajax_resp.status_code}")
                  
                  # 3. If AJAX didn't work, try the free download form (might be hidden in JavaScript)
                  if not direct_link:
                      # Look for any form that might be submitted via JavaScript
                      # Try to find the download button and extract the form action
                      download_btn = soup.find('button', {'name': 'method_free'})
                      if not download_btn:
                          download_btn = soup.find('a', string=re.compile(r'Free Download', re.I))
                      
                      if download_btn:
                          # Try to find a parent form
                          form = download_btn.find_parent('form')
                          if form:
                              action_url = form.get('action', page_url)
                              if action_url.startswith('/'):
                                  action_url = urljoin(page_url, action_url)
                              
                              # Collect form data
                              form_data = {}
                              for input_tag in form.find_all(['input', 'button']):
                                  name = input_tag.get('name')
                                  value = input_tag.get('value', '')
                                  if name:
                                      form_data[name] = value
                              
                              # Override with free download button
                              form_data['method_free'] = 'Free Download'
                              if 'op' not in form_data:
                                  form_data['op'] = 'download2'
                              if 'id' not in form_data:
                                  form_data['id'] = file_code
                              
                              print(f"Submitting form to: {action_url}")
                              resp2 = session.post(action_url, data=form_data, headers=headers)
                              resp2.raise_for_status()
                              soup2 = BeautifulSoup(resp2.text, 'html.parser')
                              
                              # Check for countdown or direct link
                              countdown_el = soup2.find('span', {'id': 'seconds'})
                              if countdown_el:
                                  try:
                                      wait_time = int(countdown_el.text.strip())
                                  except:
                                      wait_time = 15
                                  print(f"Waiting for {wait_time} seconds...")
                                  time.sleep(wait_time + 2)
                                  # Refresh or look for link
                                  resp3 = session.get(page_url, headers=headers)
                                  resp3.raise_for_status()
                                  soup3 = BeautifulSoup(resp3.text, 'html.parser')
                                  # Look for direct link
                                  link_tag = soup3.find('a', href=re.compile(r'https?://fs\d+\.uploadrar\.com:\d+/d/'))
                                  if link_tag and link_tag.get('href'):
                                      direct_link = link_tag['href']
                              else:
                                  # Look for direct link
                                  link_tag = soup2.find('a', href=re.compile(r'https?://fs\d+\.uploadrar\.com:\d+/d/'))
                                  if link_tag and link_tag.get('href'):
                                      direct_link = link_tag['href']
                  
                  # 4. Try the direct file URL pattern
                  if not direct_link:
                      # Some XFileSharing sites use pattern: /d/FILECODE/filename.rar
                      # Try to find filename from page
                      filename_elem = soup.find('b', string=re.compile(r'\.(rar|zip|mp4|exe|pdf|7z)'))
                      if filename_elem:
                          file_name = filename_elem.text.strip()
                          direct_link = f"https://fs21.uploadrar.com:183/d/{file_code}/{file_name}"
                          print(f"Trying constructed URL: {direct_link}")
                          # Test if it works
                          test_resp = session.head(direct_link, headers=headers)
                          if test_resp.status_code != 200:
                              direct_link = None
                  
                  if not direct_link:
                      print("Could not find direct download link.")
                      return False
                  
                  print(f"Direct link found: {direct_link}")
                  
                  # Determine output filename
                  if not output_filename:
                      output_filename = extract_filename_from_url(direct_link)
                      if not output_filename or output_filename == 'downloaded_file':
                          # Try to get filename from page
                          filename_elem = soup.find('b', string=re.compile(r'\.(rar|zip|mp4|exe|pdf|7z)'))
                          if filename_elem:
                              output_filename = filename_elem.text.strip()
                          else:
                              output_filename = 'uploadrar_download.bin'
                  
                  # Ensure it has a valid extension
                  if not any(output_filename.lower().endswith(ext) for ext in ['.rar', '.zip', '.mp4', '.exe', '.pdf', '.7z', '.bin']):
                      output_filename += '.rar'
                  
                  # Download the file
                  print(f"Downloading to: dl/{output_filename}")
                  os.makedirs('dl', exist_ok=True)
                  
                  # Use stream download with proper headers
                  download_headers = headers.copy()
                  download_headers['Referer'] = page_url
                  
                  file_resp = session.get(direct_link, stream=True, timeout=120, headers=download_headers)
                  file_resp.raise_for_status()
                  
                  total_size = int(file_resp.headers.get('content-length', 0))
                  downloaded = 0
                  with open(f'dl/{output_filename}', 'wb') as f:
                      for chunk in file_resp.iter_content(chunk_size=8192):
                          if chunk:
                              f.write(chunk)
                              downloaded += len(chunk)
                              if total_size:
                                  percent = (downloaded / total_size) * 100
                                  print(f"\rProgress: {percent:.1f}%", end='', flush=True)
                  print(f"\nDownload completed: dl/{output_filename}")
                  return True
                  
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  return False

          # Run the download
          page_url = os.environ.get('PAGE_URL', 'https://uploadrar.com/lsy90ncgkak3')
          output_name = os.environ.get('OUTPUT_NAME', '')
          if not download_from_uploadrar(page_url, output_name):
              exit(1)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded file from UploadRAR [skip ci]" || echo "No changes to commit"
          git push
