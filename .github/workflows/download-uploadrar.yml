name: Download from UploadRAR

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of UploadRAR download page (e.g. https://uploadrar.com/xxxxx)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Download from UploadRAR
        env:
          PAGE_URL: ${{ github.event.inputs.page_url }}
        run: |
          python << 'EOF'
          import requests
          import time
          import re
          import os
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          def download_from_uploadrar(page_url):
              session = requests.Session()
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Referer': 'https://uploadrar.com/',
              })
              
              # Step 1: Get the page
              print(f"Fetching: {page_url}")
              resp = session.get(page_url)
              resp.raise_for_status()
              soup = BeautifulSoup(resp.text, 'html.parser')
              
              # Extract file code from URL
              file_code = page_url.rstrip('/').split('/')[-1]
              print(f"File code: {file_code}")
              
              # Step 2: Find and submit the free download form
              form_data = {
                  'op': 'download2',
                  'id': file_code,
                  'method_free': 'Free Download'
              }
              
              print("Submitting free download request...")
              resp2 = session.post(page_url, data=form_data)
              resp2.raise_for_status()
              soup2 = BeautifulSoup(resp2.text, 'html.parser')
              
              # Step 3: Check for countdown
              countdown_span = soup2.find('span', id='seconds')
              if countdown_span:
                  try:
                      wait_time = int(countdown_span.text.strip())
                      print(f"Countdown: {wait_time} seconds")
                      for remaining in range(wait_time, 0, -1):
                          print(f"\rWaiting {remaining} seconds...", end='', flush=True)
                          time.sleep(1)
                      print()
                  except:
                      pass
              
              # Step 4: Get the download link
              download_link = None
              
              # Look for download button or direct link
              download_btn = soup2.find('a', {'class': 'btn-primary'})
              if download_btn and download_btn.get('href'):
                  download_link = download_btn['href']
              
              if not download_link:
                  # Look for any link containing the file extension
                  for link in soup2.find_all('a', href=True):
                      if re.search(r'\.(rar|zip|mp4|exe|pdf|7z)', link['href'], re.I):
                          download_link = link['href']
                          break
              
              if not download_link:
                  # Try the typical XFileSharing pattern
                  download_link = f"https://fs21.uploadrar.com:183/d/{file_code}/file.rar"
                  
              if not download_link:
                  print("Could not find download link")
                  return False
              
              if download_link.startswith('/'):
                  download_link = urljoin(page_url, download_link)
              
              print(f"Download link found: {download_link}")
              
              # Step 5: Download the file
              os.makedirs('dl', exist_ok=True)
              output_file = f"dl/{file_code}.rar"
              
              print(f"Downloading to {output_file}...")
              file_resp = session.get(download_link, stream=True)
              file_resp.raise_for_status()
              
              total = int(file_resp.headers.get('content-length', 0))
              downloaded = 0
              
              with open(output_file, 'wb') as f:
                  for chunk in file_resp.iter_content(chunk_size=8192):
                      if chunk:
                          f.write(chunk)
                          downloaded += len(chunk)
                          if total:
                              pct = downloaded * 100 / total
                              print(f"\rProgress: {pct:.1f}%", end='', flush=True)
              print("\nDownload complete!")
              return True
          
          success = download_from_uploadrar(os.environ['PAGE_URL'])
          if not success:
              exit(1)
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dl/
          git commit -m "Add downloaded file from UploadRAR [skip ci]" || echo "No changes to commit"
          git push
